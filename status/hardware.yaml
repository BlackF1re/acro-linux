schema_version: 3
device:
  target: sony-hikari
  model: Sony Xperia acro S LT26w
  physical:
    evidence: VERIFIED_DEVICE
    notes: Identity was observed over ADB/USB. This evidence domain never represents target-Linux progress.
  silicon:
    family: { value: Qualcomm MSM8x60 / Snapdragon S3, evidence: VERIFIED_DEVICE }
    exact_sku:
      value: MSM8260
      evidence: VERIFIED_DEVICE
      provenance: physical soc0 ID 70 plus upstream QCOM_ID_MSM8260 = 70.
    socinfo: { id: 70, version: "2.1", raw_id: 1057, raw_ver: 2, build_id: M8660A-AABQNLYM-3.1.4003T }
    legacy_bsp_platform_string:
      value: msm8660
      evidence: VERIFIED_DEVICE
      notes: Legacy Android property only; not a silicon-SKU identifier.
legacy_baseline:
  environment: ScrubbModRom KK4.4.2 v1.4.1
  android_build: Android 4.4.2 userdebug/test-keys
  kernel: 3.4.0-Elite-1.5+
  implementation: BOOTS
  root_access:
    evidence: VERIFIED_DEVICE
    observation: "adb shell su -c id returned uid=0(root) during read-only reconnaissance."
  notes: Modified Android baseline, not Sony stock. Its exposed 1890 MHz frequency is not a Sony-approved OPP.
target_linux:
  implementation: BOOTS
  lifecycle: BOOTS
  boot5_interactive:
    implementation: WORKING
    evidence: VERIFIED_DEVICE
    notes: BOOT #5.1 physically verified the built-in HSUSB static g_serial CDC ACM gadget at High Speed (480 Mbps), a bidirectional root shell, shell respawn, and stable PID 1. BusyBox already contained uname/ls/top and other applets; the prior CPIO lacked their symlinks. The host-side builder now installs symlinks without changing the BusyBox applet set.
    usb:
      controller: VERIFIED_DEVICE
      phy: VERIFIED_DEVICE
      ulpi: VERIFIED_DEVICE
      device_mode: VERIFIED_DEVICE
      high_speed: VERIFIED_DEVICE
      acm_gadget: VERIFIED_DEVICE
      ttygs0: VERIFIED_DEVICE
      console: VERIFIED_DEVICE
      interactive_root_shell: VERIFIED_DEVICE
      shell_respawn: VERIFIED_DEVICE
      otg_host: NOT_VERIFIED
      ecm: NOT_IMPLEMENTED
    display:
      mdp4: VERIFIED
      dsi: VERIFIED
      panel: VERIFIED
      backlight: VERIFIED
      fbcon: VERIFIED
      verification: VERIFIED_DEVICE
      notes: "Physical 0066 produced a readable native 720x1280 fbcon and interactive terminal. Live DRM state showed connected DSI-1, active CRTC0 and XR24 plane 2; scanout used contiguous CMA physical address 0x7bd00000 because the physical MSM8x60 MDP IOMMU contexts never enable. On 2026-09-25 Mesa Freedreno FD220 drove accelerated Cage/Foot scanout; after exact upstream A2xx fixes 5a3300f4a34a and 34b78fb26b9b a captured RGB frame had uniform edges and the owner confirmed the coloured top/right edge was absent. Display suspend/resume, brightness policy and a production Wayland session remain separate acceptance domains."
  first_mainline_execution:
    evidence: VERIFIED_DEVICE
    result: VERIFIED
    artifact: hikari-boot4-debug.elf
    notes: Boot #4 recovered through TWRP /proc/last_kmsg identifies the Hikari FDT, corrected RAM layout, SMP, ramoops, RPM, initramfs unpacking, and Run /init as init process. PID 1 then exited 0 and caused Attempted to kill init; no peripheral acceptance claim follows.
  first_mainline_boot:
    evidence: VERIFIED_DEVICE
    result: NOT_VERIFIED
    notes: The approved first Sony ELF was accepted by S1Boot, but no target-Linux marker, ADB, fastboot, or new USB target appeared during 120 seconds. Failure stage is UNKNOWN; this is not a kernel-panic diagnosis.
  second_mainline_boot:
    evidence: VERIFIED_DEVICE
    result: NOT_VERIFIED
    boot_proof: NOT_OBSERVED
    postmortem: WRONG_BOOT
    notes: The approved second Sony ELF was accepted by S1Boot through logical boot/p3. No target-Linux marker, ADB, fastboot, or new USB target appeared during 120 seconds; Power + Volume Up forced reset, original p3 restore succeeded, and Android returned. TWRP's captured previous-boot log was from a later legacy Android reboot, so the target failure stage is UNKNOWN.
  stable_pid1: { evidence: VERIFIED_DEVICE, implementation: VERIFIED, notes: "BOOT #5.1 emitted ALIVE markers through uptime 1082.67 seconds; PID 1 remained active and respawned an exited USB shell." }
  init_supervisor: { evidence: VERIFIED_DEVICE, implementation: VERIFIED }
  boot5_alive_loop: { evidence: VERIFIED_DEVICE, implementation: VERIFIED, minimum_observed_seconds: 1082.67 }
  initramfs_dev_console: { evidence: VERIFIED_DEVICE, implementation: VERIFIED, notes: "BOOT #5.1 lacked the previous unable-to-open-initial-console warning; final CPIO contains c 5:1 /dev/console." }
  notes: Mainline boot #4 reached /init on the physical device and then panicked because the diagnostic PID 1 exited. BOOT #5.1 corrected that liveness defect and verified USB device-mode diagnostics. Earlier prototypes were deployed and rolled back. Other target peripheral status remains UNKNOWN until separate acceptance tests.
  persistent_boot_diagnostics:
    physical_reader: VERIFIED_DEVICE
    writer: VERIFIED_DEVICE
    region: "0x7ffe0000-0x7fffffff"
    format: "legacy TWRP ram_console / current mainline ramoops console, DBGC, ECC block 128/parity 16/symbol 8/poly 0x11d"
    compatibility: COMPATIBLE_WITH_MATCHING_ECC
    notes: Boot #4 verified the address and TWRP /proc/last_kmsg export path with a short log. A later full zero-ECC mainline ring exceeded TWRP's 116468-byte ECC data capacity and was rejected; the DT and gate now require matching 16-byte ECC, pending a new physical capture.
boot_chain:
  fastboot:
    physical:
      evidence: VERIFIED_DEVICE
      usb_vid_pid: "0fce:0dde"
      transport: Sony Ericsson S1Boot Fastboot
      protocol_version: "0.5"
      bootloader_version: CRH1099189_R10C008
      secure: "no"
      notes: Empty unlocked/max-download-size/partition boot metadata variables are unsupported or absent legacy responses, not negative evidence.
    target_linux:
      temporary_fastboot_boot: UNKNOWN
      p3_restore:
        evidence: VERIFIED_DEVICE
        fastboot_boot_partition_restore: VERIFIED_DEVICE
        rollback_route: VERIFIED_DEVICE
        physical_write_test: VERIFIED_DEVICE
        physical_fastboot_p3_restore: VERIFIED_DEVICE
        failed_mainline_boot_rollback: VERIFIED_DEVICE
        notes: Following the failed first native-Linux ELF, hardware S1Boot accepted the exact original p3 through logical boot (S1 partID 0x00000003) and the Android baseline returned. This verifies this rollback route only, not writes to other targets.
  owner_provided_history:
    bootloader_previously_unlocked: true
    custom_rom_previously_installed: MoKee
    current_root_reported: true
    notes: Owner-provided historical evidence, not an automatically read bootloader attestation.
  legacy_p3_reference:
    physical:
      evidence: VERIFIED_DEVICE
      format: Sony-style ELF32 ARM
      kernel_load_address: "0x40208000"
      ramdisk_load_address: "0x41800000"
      rpm_load_address: "0x00020000"
      cmdline_segment: ABSENT
      notes: Extracted offline only from the private golden backup. Addresses are verified legacy starting candidates; a target artifact must validate decompressor, DTB, initramfs, firmware and reserved-memory compatibility. Exact cmdline handling remains UNKNOWN.
  kexec_loader:
    implementation: VERIFIED
    evidence: VERIFIED_DEVICE
    installed_in_p3: true
    artifact_size: 12626639
    artifact_sha256: b5d67748acc8f7e69847947717922c08593df210aec204e73462ce3f6500a964
    first_stage: "single-core mainline rescue kernel in p3"
    second_stage: "full SMP mainline kernel, DTB and initramfs on HIKARI_ROOT"
    notes: "On 2026-09-15 two complete loader-to-SMP transitions passed, separated by a normal reboot back to the loader. The loader exposed only CPU0; each kexec load set kexec_loaded=1; each second stage brought CPUs 0-1 online and mounted Debian from microSD read/write. USB ACM re-enumerated after every transition. Direct kexec from the SMP stage remains intentionally unsupported because MSM8x60 cannot prove CPU1 fully powered down."
  recovery:
    physical:
      evidence: VERIFIED_DEVICE
      implementation: TWRP 2.6.3.0
      reachable: VERIFIED_DEVICE
      twrp_storage_relation: REFERENCES_EXTERNAL_STORAGE
      notes: Recovery runtime was observed over ADB and owner returned to Android. Offline p3 bootrec references p11 as FOTA/recovery payload, but p11 was not read; storage location, p3 independence and rollback suitability remain UNKNOWN.
    target_linux:
      rollback_route: VERIFIED_DEVICE
      notes: The bootloader-level p3 restore route was physically used after the first failed native-Linux attempt; TWRP storage and independence from p3 remain UNKNOWN.
subsystems:
  cpu_smp: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: VERIFIED, evidence: VERIFIED_DEVICE, notes: "BOOT #4 post-mortem identified two CPU bring-up; BOOT #5.1 remained live on both CPUs. On 2026-09-15 the single-core p3 loader twice kexeced the full kernel, whose normal SCM path brought CPUs 0-1 online. Runtime offlining CPU1 succeeded but onlining it again failed EIO, so direct SMP-stage kexec remains correctly blocked rather than faking CPU-kill support." } }
  memory: { physical: { evidence: VERIFIED_VENDOR_SOURCE, nominal_mib: 1024 }, legacy_baseline: { implementation: WORKING }, target_linux: { implementation: VERIFIED, evidence: VERIFIED_DEVICE, linux_ram_mib: 939, memtotal_kib: 928996, notes: "Sony Fuji board data defines 44+384+511 MiB of normal RAM, ending at 0x7fefffff; upstream additionally reserves the leading 2 MiB DT span for SMEM. On 2026-09-25 the physical SYSTEM boot exposed 0x40000000-0x42dfffff and 0x48000000-0x7fefffff, 255 MiB HighMem and the required 64 MiB CMA pool. A 640 MiB anonymous mapping passed complete 0x55 and 0xaa write/read cycles without page, allocation, abort, Oops or panic errors; FD220 rendering, USB networking and Wi-Fi remained operational afterward. Direct fbcon-to-kmscube master handoff emits two repeatable primary-interface underruns; that separate display-transition issue is not classified as a memory fault." } }
  storage_emmc: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: UNKNOWN } }
  storage_microsd: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: WORKING, notes: Separate mmcblk1/mmcblk1p1 SD path was mounted, wrote the C2 raw-backup stream, and its parts passed hash validation. }, target_linux: { implementation: BOOTS, evidence: VERIFIED_DEVICE, notes: "Physical Debian migration boots discovered the 29.5 GiB card, mounted HIKARI_ROOT read/write, printed HIKARI ROOT READY, switched to Debian systemd and remained alive with no failed units. On 2026-09-15 it supplied two checksum-verified SMP kexec boots and stayed the read/write Debian root. Its node varied among mmcblk0p1, mmcblk1p1 and mmcblk2p1 across boots, validating label-based discovery. Sustained storage I/O and removal handling remain unverified." } }
  display: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: WORKING }, target_linux: { implementation: VERIFIED, evidence: VERIFIED_DEVICE, notes: "Physical 0066 produced a readable native 720x1280 fbcon and interactive terminal, with active DRM CRTC/plane, contiguous CMA scanout at 0x7bd00000, advancing MDP/DSI IRQs, and no underrun, kernel fault or hung task through at least 867 seconds. Display suspend/resume, brightness policy and accelerated GPU remain separate acceptance domains." } }
  touchscreen: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: WORKING, evidence: VERIFIED_DEVICE, notes: "On 2026-09-23 the upstream RMI4 stack exposed the Synaptics TM1964-001 as a direct touchscreen with 720x1280 single-touch axes and ten MT slots. Physical taps, drags and simultaneous contacts produced 10323 evtest events, 38 tracking IDs across slots 0..2, pressure/major/minor data and clean releases with no SYN_DROPPED. Full-edge calibration and compositor/libinput integration remain open." } }
  gpu: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: WORKING, evidence: VERIFIED_DEVICE, notes: "DRM/MSM loads the A220 firmware and exposes card0/renderD128. Exact upstream Mesa fixes 5a3300f4a34a and 34b78fb26b9b respectively correct the A2xx shader-lowering crash and last-row/column window-scissor error. Five GLES2 draw/readback tests returned the expected RGBA; on 2026-09-25 EGL/GLES2 reported FD220, an accelerated 720x1280 capture had uniform edges, and the owner confirmed the coloured top/right edge was absent. A normal unprivileged Wayland session and performance/power acceptance remain open." } }
  wifi: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: WORKING, evidence: VERIFIED_DEVICE, notes: "BCM4330 enumerates over SDIO, loads owner-supplied stock firmware/calibration, and uses NetworkManager for association, DHCP and reconnect. An earlier PIO fix still failed after 6493 seconds because it restarted the Qualcomm FIFO-window offset at each burst. The revised MMCI path advances across the complete cyclic window for one PIO service exactly as Sony's downstream MSM SDCC driver does. On 2026-09-25 the physical device passed ten reconnects, about 355 MiB of HTTPS RX, and three post-stress reconnects with traffic, with no MCI_STARTBITERR, RXHEADER or backplane-access error. Signed wireless-regdb is installed; repeated long-idle reconnect, firmware regulatory completeness, power use and suspend/resume remain unverified." } }
  bluetooth: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: PARTIAL, evidence: VERIFIED_DEVICE, notes: "On 2026-09-23 the serdev HCI UART identified BCM4330B1 and BlueZ powered hci0. The owner-supplied stock BCM4330 HCD firmware is reproducibly materialized outside Git, downloaded successfully (build 0536), and the private stock address is injected into the personalized DT without committing it. A physical active scan received twelve reports/devices. Pairing, connection, payload transfer and suspend/resume are not verified." } }
  usb_device: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: WORKING, evidence: VERIFIED_DEVICE, notes: "Sony-derived Android enumerated as 0fce:5176 with MTP/ADB and sustained bidirectional ADB across disconnect/reconnect." }, target_linux: { implementation: WORKING, evidence: VERIFIED_DEVICE, notes: "Build 0075 physically enumerated the static g_serial CDC ACM gadget as 0525:a4a7 at High Speed. Build 0083 verified controlling-terminal behavior. On 2026-09-15 Debian physically completed a device-host-device cycle using a persistent configfs ACM function: the PC regained 0525:a4a7 and /dev/ttyACM0 on the same running kernel, role=device, UDC=configured, with no legacy gserial teardown or hung-task signature. On 2026-09-24 the event-driven configfs setup added ACM+NCM during BOOT-to-SYSTEM transition, deliberately re-enumerated once, and restored both the terminal and SSH/IP connectivity. The obsolete one-second polling watcher is removed. Repeated-cycle endurance and suspend/resume remain unverified." } }
  usb_otg_host: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: WORKING, evidence: VERIFIED_DEVICE, notes: "Sony-derived Android physically enumerated QUMO 090c:1000, Kingston DataTraveler 0951:1665, and a 25a7:fa61 HID keyboard/mouse receiver. PM8901 MPP1 ext_5v_en and TLMM28 ncp373_en asserted; active-low TLMM104 fault recovered high." }, target_linux: { implementation: WORKING, evidence: VERIFIED_DEVICE, notes: "Build 0079 physically supplied VBUS and enumerated Realtek 2c4e:0102. On 2026-09-15 the current Debian kernel entered EHCI host mode, enumerated HID keyboard 04f3:0103, and accepted real keystrokes at fbcon; OTG removal cleanly deregistered EHCI and returned to the configfs serial gadget. This verifies source power, role switching, HID enumeration/input traffic, teardown, and return to device mode. Wi-Fi network data through the earlier adapter, repeated-cycle endurance, and suspend/resume remain separately unverified." } }
  hdmi: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: UNKNOWN } }
  audio: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: IMPLEMENTING, notes: "Native Timpani control and QDSP6v3 remoteproc bring-up in patch 0021. PCM, codec routes and physical playback/capture are not yet verified; see docs/AUDIO.md." } }
  camera: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: UNKNOWN } }
  modem: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: UNKNOWN } }
  gnss: { physical: { evidence: UNKNOWN }, legacy_baseline: { implementation: UNKNOWN }, target_linux: { implementation: UNKNOWN } }
  nfc: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: UNKNOWN } }
  fm_radio: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: PARTIAL } }
  battery_charging: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: WORKING, evidence: VERIFIED_DEVICE, notes: "Sony-derived Android USB-cycle test changed from -0.16..-0.28 A/Discharging unplugged to +0.31..+0.36 A/Charging on a 500 mA standard downstream port; voltage rose about 4.09 -> 4.18 V and SOC advanced 93% -> 94%. Cradle remains NOT_VERIFIED because the available cradle appears defective." }, target_linux: { implementation: PARTIAL, evidence: VERIFIED_DEVICE, notes: "On 2026-09-22 patch 0074 removed the unconditional ten-second HZ/CE restart. The owner observed steady external USB-meter current. Fifteen on-device samples over more than two minutes retained STAT=0x48, CONTROL=0xac and +0.223..+0.229 A battery current while voltage rose 3.990->3.997 V; only the initial USB-ready 0x28 to charging 0x48 transition appeared in the log. On 2026-09-23 the SYSTEM SMP kernel reported a Full battery at 4.204..4.205 V and six samples at only 56..69 mA despite a configured 1.525 A maximum, physically confirming upper-charge taper rather than maximum-current demand. On 2026-10-04 test kernels #16/#17 register native GPIO126/IN cradle support and physically demonstrates owner-authorized USB probing: 500/800/900/1500 mA, VIN-DPM at 1500 then stable 900 mA, battery net 488..777 mA; GPU Phosh remains active. Cradle input ceiling 2500 mA is source-verified only; powered-cradle charging, suspend charging, complete disconnect/restart endurance and full low-to-full cycle remain unverified." } }
  thermal: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: PARTIAL, evidence: VERIFIED_DEVICE, notes: "Patch 0077 models the useful MSM8660 on-die TSENS channel in the standard Qualcomm thermal, NVMEM and hwmon frameworks from Sony BSP register, IRQ, calibration-byte and slope evidence. On 2026-09-24 the physical SYSTEM boot completed without the former timeout/oops; twelve samples stayed at a plausible 42--43 C, lm-sensors reported soc_thermal at the same value, systemd had zero failed units and pstore was empty. Cooling devices, protective trip points, IRQ acceptance and thermal throttling remain unverified and depend on correct MSM8660 cpufreq support." } }
  cpu_frequency: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: PARTIAL, evidence: VERIFIED_DEVICE, notes: "2026-10-04 temporary CPU0 clock-only module physically switched 384/432/540/648/756 MHz with hardware rate reads and compute checks; schedutil reached 756 MHz under load and 384 MHz after load. Boot voltage and L2 retained, CPU1 unmanaged; no persistent installation. Full DVFS requires native SAW regulator support, shared-L2 coordination, thermal and hotplug acceptance. See research/device/current/power/cpu-sleep-20261004/RESULTS.md." } }
  rtc: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: PARTIAL, evidence: VERIFIED_DEVICE, notes: "On 2026-09-23 rtc-pm8xxx accepted hwclock --systohc and immediately read the programmed UTC time back correctly. systemd-timesyncd then contacted 0.debian.pool.ntp.org and completed initial synchronization. A powered-off retention test and RTC restoration on the next cold boot remain required." } }
  suspend_resume:
    target_linux:
      implementation: PARTIAL
      evidence: VERIFIED_DEVICE
      notes: "On 2026-10-08 five conservative MSM8660 RPM-notified CPU0 collapse cycles woke with RTC alarm IRQ delivery, CPU1 online, USB and hardware Phosh restored. Four post-resume transition processes gave 224 NEAR/0 SEVERE; S3 passed 16/16; owner confirmed display and touch. GPIO-key wake was isolated during tests; cpuidle was disabled. The subsequent MPU3050 auxiliary-bus PM link and balanced select/deselect passed three fresh-boot RTC/deep cycles with working accelerometer/gyro raw reads and no sensor PM errors; post-resume GPU gave another 168 NEAR/0 SEVERE. Wi-Fi passed post-cycle ICMP traffic but logs an HTAvail resume warning. On 2026-10-09 the Sony/Fuji level policy completed four level-7 PXO-OFF/L2-HSFS_OPEN collapses with 750/500 mV sleep votes, including Phosh screen-blank sleep; a 5000-us QoS constraint selected level 5 and resumed. Post-resume 256x256 probes gave 168 NEAR/0 SEVERE and S3 16/16 PASS with no new GPU faults or MDP underruns. Wi-Fi was blocked; all-peripheral wake coverage, every individual level and minimum sleep current remain unverified. See docs/POWER.md."
  watchdog: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: UNKNOWN } }
  sensors: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: PARTIAL, evidence: VERIFIED_DEVICE, notes: "On 2026-09-24 physical motion and orientation tests produced coherent per-axis changes from BMA250, MPU3050 and AKM8972; APDS9702 changed cleanly between far and near with IRQ delivery. AS3676 ambient light produced stable on-demand readings, but its continuous mode correlated with a display-loss experiment and remains disabled pending diagnosis. Exact Sony Fuji wiring for PM8058 XOADC channels 5--9 is implemented; all five read on-device. The channel-7 MSM board NTC fell from about 1.217 to 1.185 V during CPU heating and now exports a standard msm-board-thermal zone through generic-adc-thermal. Repeated physical headset cycles changed TLMM61, incremented its edge IRQ and correctly updated the wake-capable SW_HEADPHONE_INSERT input switch after Sony's 1500 ms debounce. XOADC channel 5 accessory/button classification requires mic-bias and remains part of deferred audio work; battery thermistor/ID and charger-current state transitions also remain to be accepted." } }
  leds_haptics: { physical: { evidence: VERIFIED_DEVICE }, legacy_baseline: { implementation: PROBES }, target_linux: { implementation: PARTIAL, evidence: VERIFIED_DEVICE, notes: "On 2026-09-24 the owner visually confirmed the complete ordered AS3676 test: red, green and blue notification outputs and the capacitive-button backlight all illuminated in the requested order. LED brightness range/endurance and haptics remain unverified, so the combined domain is PARTIAL rather than VERIFIED." } }
legacy_runtime_observations:
  wifi: ["DHD legacy driver reports firmware up; no association acceptance test was run."]
  modem: ["PIL brought modem out of reset.", "APR runtime log reports modem up."]
  charging: ["BQ24160 log records charge-current/state transitions.", "BQ27520 log records capacity changes and fully-charged indication."]
  camera: ["Main and front modules probed; legacy CSI configuration logged for both."]
  touchscreen: ["ClearPad logged runtime power-off on early suspend and power-on on late resume."]
notes:
  - Legacy runtime observations are not target-Linux VERIFIED states and are not formal acceptance tests.
  - VERIFIED for a target subsystem requires a function-specific acceptance test on the physical Xperia.
  - Power + Volume Up is a VERIFIED_DEVICE forced-reset/shutdown action for a hung experimental kernel; phone off + Volume Up + USB is the separate S1Boot entry action.
  - The second layout's SMEM placement at 0x40200000 was a double-offset error. BOOT #4 and BOOT #5.1 physically verify the corrected 0x40000000 physical-base model with upstream SMEM reservation.
  - TWRP physically observed only the legacy-truncated System RAM ending at 0x6e5fffff. Sony's exact three-bank Fuji map and the 2026-09-25 target boot plus 640 MiB stress test supersede that bring-up limit; the final normal address remains 0x7fefffff.
