schema_version: 3
device:
  target: sony-hikari
  model: Sony Xperia acro S LT26w
  physical:
    evidence: VERIFIED_DEVICE
    notes: Identity was observed over ADB/USB. This evidence domain never represents target-Linux progress.
  silicon:
    family: { value: Qualcomm MSM8x60 / Snapdragon S3, evidence: VERIFIED_DEVICE }
    exact_sku:
      value: MSM8260
      evidence: VERIFIED_DEVICE
      provenance: physical soc0 ID 70 plus upstream QCOM_ID_MSM8260 = 70.
    socinfo: { id: 70, version: "2.1", raw_id: 1057, raw_ver: 2, build_id: M8660A-AABQNLYM-3.1.4003T }
    legacy_bsp_platform_string:
      value: msm8660
      evidence: VERIFIED_DEVICE
      notes: Legacy Android property only; not a silicon-SKU identifier.
legacy_baseline:
  environment: ScrubbModRom KK4.4.2 v1.4.1
  android_build: Android 4.4.2 userdebug/test-keys
  kernel: 3.4.0-Elite-1.5+
  implementation: BOOTS
  root_access:
    evidence: VERIFIED_DEVICE
    observation: "adb shell su -c id returned uid=0(root) during read-only reconnaissance."
  notes: Modified Android baseline, not Sony stock. Its exposed 1890 MHz frequency is not a Sony-approved OPP.
target_linux:
  implementation: IMPLEMENTING
  lifecycle: IMPLEMENTING
  first_mainline_boot:
    evidence: VERIFIED_DEVICE
    result: NOT_VERIFIED
    notes: The approved first Sony ELF was accepted by S1Boot, but no target-Linux marker, ADB, fastboot, or new USB target appeared during 120 seconds. Failure stage is UNKNOWN; this is not a kernel-panic diagnosis.
  notes: A local-only upstream kernel/DTB/initramfs/ELF prototype was deployed once and rolled back. Target Linux has not been shown to boot or probe on the device.
boot_chain:
  fastboot:
    physical:
      evidence: VERIFIED_DEVICE
      usb_vid_pid: "0fce:0dde"
      transport: Sony Ericsson S1Boot Fastboot
      protocol_version: "0.5"
      bootloader_version: CRH1099189_R10C008
      secure: "no"
      notes: Empty unlocked/max-download-size/partition boot metadata variables are unsupported or absent legacy responses, not negative evidence.
    target_linux:
      temporary_fastboot_boot: UNKNOWN
      p3_restore:
        evidence: VERIFIED_DEVICE
        fastboot_boot_partition_restore: VERIFIED_DEVICE
        rollback_route: VERIFIED_DEVICE
        physical_write_test: VERIFIED_DEVICE
        physical_fastboot_p3_restore: VERIFIED_DEVICE
        failed_mainline_boot_rollback: VERIFIED_DEVICE
        notes: Following the failed first native-Linux ELF, hardware S1Boot accepted the exact original p3 through logical boot (S1 partID 0x00000003) and the Android baseline returned. This verifies this rollback route only, not writes to other targets.
  owner_provided_history:
    bootloader_previously_unlocked: true
    custom_rom_previously_installed: MoKee
    current_root_reported: true
    notes: Owner-provided historical evidence, not an automatically read bootloader attestation.
  current_legacy_p3:
    physical:
      evidence: VERIFIED_DEVICE
      format: Sony-style ELF32 ARM
      kernel_load_address: "0x40208000"
      ramdisk_load_address: "0x41800000"
      rpm_load_address: "0x00020000"
      cmdline_segment: ABSENT
      notes: Extracted offline only from the private golden backup. Addresses are verified legacy starting candidates; a target artifact must validate decompressor, DTB, initramfs, firmware and reserved-memory compatibility. Exact cmdline handling remains UNKNOWN.
  recovery:
    physical:
      evidence: VERIFIED_DEVICE
      implementation: TWRP 2.6.3.0
      reachable: VERIFIED_DEVICE
      twrp_storage_relation: REFERENCES_EXTERNAL_STORAGE
      notes: Recovery runtime was observed over ADB and owner returned to Android. Offline p3 bootrec references p11 as FOTA/recovery payload, but p11 was not read; storage location, p3 independence and rollback suitability remain UNKNOWN.
    target_linux:
      rollback_route: VERIFIED_DEVICE
      notes: The bootloader-level p3 restore route was physically used after the first failed native-Linux attempt; TWRP storage and independence from p3 remain UNKNOWN.
